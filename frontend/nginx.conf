server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bilder gehen per presigned URL direkt an den Objektspeicher, durch nginx
    # laufen nur JSON-Requests. 1 MB reicht dafür reichlich.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Gehashte Assets von Vite dürfen dauerhaft gecacht werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Alles, was das Spring-Boot-Backend bedient. Die Pfade stehen so in
    # SecurityConfig und im AuthSuccessHandler — deshalb kein /api-Präfix:
    # das Refresh-Cookie hängt an Pfad /auth, und Googles Redirect-URI zeigt
    # auf /login/oauth2/code/google. Ein Präfix müsste man überall nachziehen.
    location ~ ^/(auth|tours|oauth2|login)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # OAuth2-Redirects laufen über den Browser, nicht über nginx.
        proxy_redirect off;
    }

    # SPA-Fallback: jede andere Route rendert React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
